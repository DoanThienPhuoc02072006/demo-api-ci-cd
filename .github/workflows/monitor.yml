name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cài đặt công cụ Newman
        run: npm install -g newman

      - name: Chạy Monitor tự động từ file cục bộ
        run: newman run Production_Monitor_Demo.postman_collection.json
